[project]
name = "factql-mcp"
version = "0.1.0"
description = "MCP server for FactQL: ask plain-English questions of your database from Claude, Cursor or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FactQL" }]
keywords = ["mcp", "model-context-protocol", "text-to-sql", "nl2sql", "analytics", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://factql.ai"
Documentation = "https://docs.factql.ai"
Repository = "https://github.com/factql/factql-mcp"

[project.scripts]
factql-mcp = "factql_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factql_mcp"]
